<style>
:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#55524f;--teal:#004942;--teal-deep:#00352f;--tint:#e3edeb;--on-teal:#ffffff;
  --error:#b3261e;--warn-bg:#fdecea;--warn:#7a1712;
  --display:"Poort Archivo","Archivo","Helvetica Neue",Arial,sans-serif;--text:"Poort Hanken","Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --kop:3.5rem;--gutter:max(clamp(1rem,4vw,3rem),env(safe-area-inset-left,0px))}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-auto] body{visibility:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--text);font-variant-numeric:lining-nums tabular-nums;-webkit-tap-highlight-color:transparent}
::selection{background:var(--teal);color:var(--on-teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1{margin:0;font:700 clamp(1.75rem,1.4rem + 1.5vw,2.25rem)/1.06 var(--display);letter-spacing:-.012em;text-wrap:balance;overflow-wrap:break-word;hyphens:manual}
p{margin:0;text-wrap:pretty}
button,input{font:inherit;color:inherit}
button,input,label{touch-action:manipulation}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:80rem;margin:0 auto;padding-inline:var(--gutter)}
header{background:var(--teal);color:var(--on-teal);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;min-height:var(--kop)}
.brand{display:flex;align-items:center;gap:.85rem}
.brand img{display:block;height:clamp(1.4rem,1.05rem + 1.6vw,1.75rem);width:auto}
.brand span{font:600 1rem/1 var(--display);padding-left:.85rem;border-left:1px solid rgb(255 255 255 / .35)}
.brand .logo-tekst{font-size:1.25rem;padding-left:0;border-left:0}
.poort{display:grid;justify-items:center;padding:clamp(1.5rem,9vh,5.5rem) var(--gutter) 3rem}
.poort-kaart{width:min(27rem,100%);border-top:2px solid var(--fg);background:var(--tint);padding:1.5rem 1.25rem 1.35rem;display:flex;flex-direction:column;gap:.55rem}
.poort-kaart p{line-height:1.5}
.veld{display:block;font-size:.9375rem;color:var(--muted);margin:.6rem 0 .1rem}
.ww-rij{display:flex;align-items:stretch;background:var(--bg);border-bottom:1.5px solid var(--fg)}
.ww-rij:hover{border-bottom-color:var(--teal)}
.ww-rij:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.ww-rij[data-fout]{border-bottom-color:var(--error)}
.ww-rij input{flex:1;min-width:0;height:3rem;padding:0 .75rem;border:0;border-radius:0;background:transparent;color:var(--fg);caret-color:var(--teal)}
.ww-rij input:focus-visible{outline:none}
.tekstknop{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 .9rem;border:0;background:none;color:var(--teal);font:600 .95rem/1.2 var(--display);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;cursor:pointer}
.tekstknop:hover{text-decoration-thickness:2px}
.status{font-size:.9375rem;line-height:1.45;color:var(--muted)}
.status:empty{display:none}
.status.fout{color:var(--warn);font-weight:600}
.knop{align-self:flex-start;margin-top:.3rem;display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.55rem 1.25rem;border-radius:999px;border:1.5px solid var(--teal);background:var(--teal);color:var(--on-teal);font:600 .95rem/1.2 var(--display);cursor:pointer}
.knop:hover{background:var(--teal-deep);border-color:var(--teal-deep)}
.knop:active{transform:translateY(1px)}
.knop:disabled{opacity:.6;cursor:progress}
.hulp{margin-top:.4rem;color:var(--muted);font-size:.9375rem;line-height:1.5}
.melding{width:min(27rem,calc(100% - 2 * var(--gutter)));margin:clamp(1.5rem,9vh,5.5rem) auto 0;border:1px solid var(--error);background:var(--warn-bg);color:var(--warn);padding:.75rem .9rem;font-size:.9375rem;line-height:1.45}
</style>
<noscript><style>.poort{display:none}</style></noscript>

<main id="hoofd">

  <section class="poort" aria-labelledby="t-poort">

<script>
(function () {
  "use strict";
  var OPSLAG = "prospectie-sleutel";
  var form = document.getElementById("poort-form"), veld = document.getElementById("ww");
  var st = document.getElementById("poort-st"), knop = document.getElementById("poort-knop");
  var toon = document.getElementById("ww-toon"), rij = veld.parentNode;
  var P = null, bezig = false;
  var LOCK = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="2.75" y="7" width="10.5" height="7.25" rx=".75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.25 7V5.1a2.75 2.75 0 0 1 5.5 0V7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  // knop 'Vergrendel': staat in een eigen strook onderaan de pagina (#pd-strook) en blijft tijdens het scrollen
  // onderaan in beeld (#pd-slot is sticky). Zo bedekt hij nooit blijvend de laatste regel van de pagina.
  // scroll-padding-bottom: een element dat met Tab onderaan in beeld komt, schuift boven de knop (niet eronder)
  var KNOP_CSS = "html{scroll-padding-bottom:4.75rem}#pd-strook{display:block;height:4.75rem;margin:0;padding:0;border:0}"
    + "#pd-slot{position:sticky;bottom:0;z-index:35;display:flex;justify-content:flex-end;margin:-3.75rem 0 0;padding:0 max(1rem,env(safe-area-inset-right,0px)) max(1rem,env(safe-area-inset-bottom,0px));pointer-events:none}"
    + "#pd-vergrendel{pointer-events:auto;display:inline-flex;align-items:center;gap:.45rem;min-height:2.75rem;margin:0;padding:0 1.1rem 0 .95rem;border:1.5px solid #004942;border-radius:999px;background:#fff;color:#004942;font:600 .9375rem/1 \"Archivo\",\"Helvetica Neue\",Arial,sans-serif;letter-spacing:0;text-transform:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}"
    + "#pd-vergrendel:hover{background:#e3edeb}#pd-vergrendel:focus-visible{outline:2px solid #004942;outline-offset:2px}#pd-vergrendel svg{display:block;flex:none}";

  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function naarB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function geladen() {
    return new Promise(function (klaar) {

      else window.addEventListener("load", function () { klaar(); }, { once: true });
    });
  }
  async function pakket() {

    return P;
  }
  function kan() { return !!(window.crypto && crypto.subtle && window.TextEncoder && window.TextDecoder); }
  function inFrame() { try { return window.top !== window.self; } catch (e) { return true; } }

  function wis() { try { sessionStorage.removeItem(OPSLAG); } catch (e) { /* geen sessie-opslag */ } }

  }

  // achtergrondkleur van het onderste blok van de pagina (bv. de teal slotband), zodat de strook aansluit
  function onderkleur() {

    for (var diepte = 0; el && diepte < 6; diepte++) {
      var kind = null;
      for (var c = el.lastElementChild; c; c = c.previousElementSibling) {
        if (/^(SCRIPT|STYLE|TEMPLATE|NOSCRIPT|DIALOG)$/.test(c.tagName)) continue;

    k.type = "button"; k.id = "pd-vergrendel";
    k.title = "Sluit het dashboard af. Daarna vraagt het opnieuw je wachtwoord.";
    k.innerHTML = LOCK + "<span>Vergrendel</span>";
    k.addEventListener("click", function () { wis(); location.reload(); });
    slot.appendChild(k);
    document.body.appendChild(strook);
    document.body.appendChild(slot);
    window.addEventListener("beforeprint", function () { strook.style.display = slot.style.display = "none"; });
    window.addEventListener("afterprint", function () { strook.style.display = slot.style.display = ""; });

  }
  function toonPagina(tekst) {

    try { document.fonts.forEach(function (f) { if (/Poort /.test(f.family)) weg.push(f); }); } catch (e) { /* geen FontFace-API */ }
    document.open();
    document.write(tekst);
    document.close();
    weg.forEach(function (f) { try { document.fonts.delete(f); } catch (e) { /* niets */ } });
    vergrendelKnop();
  }

  }
  function klaarVoorInvoer() { bezig = false; knop.disabled = false; }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (bezig) return;
    var ww = veld.value;
    if (!ww) { fout("Vul het wachtwoord in."); return; }
    if (inFrame()) { fout("Open het dashboard rechtstreeks via de link, niet binnen een andere pagina."); return; }
    if (!kan()) { fout("Deze browser kan het dashboard niet openen. Probeer het in een recente versie van Safari, Chrome of Edge."); return; }
    bezig = true; knop.disabled = true; st.className = "status"; st.textContent = "Bezig met openen…";
    var sleutel, tekst;
    try { sleutel = await sleutelVan(ww); tekst = await ontsleutel(sleutel); }
    catch (err) {
